wf('src/main/java/com/example/giftautobuyer/MainActivity.java','package com.example.giftautobuyer;\nimport android.app.*; import android.os.*; import android.content.pm.PackageManager;\nimport android.view.*; import android.widget.*;\npublic class MainActivity extends Activity {\n TextView status,log; Switch autoBuy,newOnly,noResale,dryRun; EditText maxPrice,quantity; boolean running=true;\n public void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_main);\n  status=findViewById(R.id.status);log=findViewById(R.id.log);autoBuy=findViewById(R.id.autoBuy);\n  newOnly=findViewById(R.id.newOnly);noResale=findViewById(R.id.noResale);dryRun=findViewById(R.id.dryRun);\n  maxPrice=findViewById(R.id.maxPrice);quantity=findViewById(R.id.quantity);\n  findViewById(R.id.stop).setOnClickListener(v->{running=false;status.setText("Остановлено");log.setText("Мониторинг остановлен.");});\n  findViewById(R.id.testGift).setOnClickListener(v->test());\n  if(Build.VERSION.SDK_INT>=33&&checkSelfPermission("android.permission.POST_NOTIFICATIONS")!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"},10);\n }\n void test(){if(!running)return;int p=2500;try{p=Math.min(p,Integer.parseInt(maxPrice.getText().toString()));}catch(Exception e){}\n  status.setText("⚡ Найден новый Gift!");\n  if(dryRun.isChecked())log.setText("🧪 DRY RUN\\nDemo Gift\\nЦена: ⭐ "+p+"\\nПокупка НЕ выполнялась.");\n  else log.setText("ДЕМО: реальная покупка отключена.\\nGift: ⭐ "+p+"\\nКоличество: "+quantity.getText());\n }\n}')
