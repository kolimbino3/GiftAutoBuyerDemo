plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'com.example.giftautobuyer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.giftautobuyer'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1-demo'
    }
}

def writeFile = { String path, String content ->
    def f = file(path)
    f.parentFile.mkdirs()
    f.text = content
}

writeFile('src/main/AndroidManifest.xml', '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
    <application android:theme="@style/AppTheme" android:label="Gift AutoBuyer Demo">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>''')

writeFile('src/main/res/values/styles.xml', '''<resources>
<style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
    <item name="android:fontFamily">sans</item>
    <item name="android:colorAccent">#4CAF50</item>
</style>
</resources>''')

writeFile('src/main/res/layout/activity_main.xml', '''<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
android:layout_width="match_parent" android:layout_height="match_parent">
<LinearLayout android:orientation="vertical" android:padding="22dp"
android:layout_width="match_parent" android:layout_height="wrap_content">

<TextView android:text="Gift AutoBuyer" android:textSize="28sp"
android:textStyle="bold" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

<TextView android:text="⭐ Баланс: 225 754" android:textSize="20sp"
android:paddingTop="18dp" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

<Switch android:id="@+id/autoBuy" android:text="Автопокупка"
android:checked="true" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

<Switch android:id="@+id/newOnly" android:text="Только новые релизы"
android:checked="true" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

<Switch android:id="@+id/noResale" android:text="Игнорировать resale"
android:checked="true" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

<Switch android:id="@+id/dryRun" android:text="🧪 Dry Run (без покупки)"
android:checked="true" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

<TextView android:text="Макс. цена ⭐" android:paddingTop="18dp"
android:layout_width="match_parent" android:layout_height="wrap_content"/>

<EditText android:id="@+id/maxPrice" android:text="10000"
android:inputType="number" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

<TextView android:text="Количество" android:paddingTop="10dp"
android:layout_width="match_parent" android:layout_height="wrap_content"/>

<EditText android:id="@+id/quantity" android:text="10"
android:inputType="number" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

<TextView android:id="@+id/status" android:text="🟢 Слежу..."
android:textSize="18sp" android:paddingTop="20dp"
android:layout_width="match_parent" android:layout_height="wrap_content"/>

<Button android:id="@+id/testGift"
android:text="⚡ Тест: обнаружить новый Gift"
android:layout_width="match_parent" android:layout_height="wrap_content"
android:layout_marginTop="18dp"/>

<Button android:id="@+id/stop" android:text="🛑 ОСТАНОВИТЬ"
android:layout_width="match_parent" android:layout_height="wrap_content"
android:layout_marginTop="10dp"/>

<TextView android:id="@+id/log"
android:text="Демо-режим: реальные Telegram-покупки отключены."
android:paddingTop="18dp" android:layout_width="match_parent"
android:layout_height="wrap_content"/>

</LinearLayout>
</ScrollView>''')

writeFile('src/main/java/com/example/giftautobuyer/MainActivity.java', '''package com.example.giftautobuyer;

import android.app.*;
import android.os.*;
import android.content.pm.PackageManager;
import android.widget.*;

public class MainActivity extends Activity {
    TextView status, log;
    Switch autoBuy, newOnly, noResale, dryRun;
    EditText maxPrice, quantity;
    boolean running = true;

    @Override
    public void onCreate(Bundle b) {
        super.onCreate(b);
        setContentView(R.layout.activity_main);

        status = findViewById(R.id.status);
        log = findViewById(R.id.log);
        autoBuy = findViewById(R.id.autoBuy);
        newOnly = findViewById(R.id.newOnly);
        noResale = findViewById(R.id.noResale);
        dryRun = findViewById(R.id.dryRun);
        maxPrice = findViewById(R.id.maxPrice);
        quantity = findViewById(R.id.quantity);

        findViewById(R.id.stop).setOnClickListener(v -> {
            running = false;
            status.setText("🔴 Остановлено");
            log.setText("Мониторинг остановлен.");
        });

        findViewById(R.id.testGift).setOnClickListener(v -> testGift());

        if (Build.VERSION.SDK_INT >= 33 &&
            checkSelfPermission("android.permission.POST_NOTIFICATIONS")
            != PackageManager.PERMISSION_GRANTED) {
            requestPermissions(
                new String[]{"android.permission.POST_NOTIFICATIONS"}, 10
            );
        }
    }

    void testGift() {
        if (!running) return;

        int price = 2500;

        try {
            price = Math.min(
                price,
                Integer.parseInt(maxPrice.getText().toString())
            );
        } catch (Exception ignored) {}

        status.setText("⚡ Найден новый Gift!");

        if (dryRun.isChecked()) {
            log.setText(
                "🧪 DRY RUN\\n" +
                "Demo Gift\\n" +
                "Цена: ⭐ " + price + "\\n" +
                "Покупка НЕ выполнялась."
            );
        } else {
            log.setText(
                "ДЕМО: реальная покупка отключена.\\n" +
                "Gift: ⭐ " + price + "\\n" +
                "Количество: " + quantity.getText()
            );
        }
    }
}''')
